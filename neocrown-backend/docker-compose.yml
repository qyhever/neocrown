services:
  app:
    image: ${IMAGE_NAME:-neocrown-backend}:${IMAGE_TAG:-1.0.0}
    container_name: neocrown-backend
    network_mode: host
    ports:
      - "8300:8300"
    env_file:
      - .env
      - .env.production
    environment:
      NODE_ENV: production
    volumes:
        - ./logs:/app/logs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.PORT || 8300) + '/api/meta')
          .then((response) => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped
